[versions]
agp = "9.3.1"
kotlin = "2.3.21"
compose-bom = "2026.06.00"
core-ktx = "1.18.0"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.9.8"
datastore = "1.2.1"
coroutines = "1.11.0"
serialization = "1.9.0"
room3 = "3.0.0"
paging = "3.4.2"
sqlite = "2.7.0"
# Stage-1 词面检索实验台（WP-C）：JVM 侧跑真 SQLite FTS5 + bm25() 的**测试**依赖。
# 版本取自 Maven Central 的 maven-metadata.xml（`<release>` = 3.53.4.0，2026-08-26 发布）。
sqlite-jdbc = "3.53.4.0"
ksp = "2.3.10"
kover = "0.9.1"
benchmark = "1.4.0"
baselineprofile = "1.5.0-rc01"
uiautomator = "2.3.0"
profileinstaller = "1.4.0"
junit = "4.13.2"
androidx-junit = "1.3.0"
androidx-test-runner = "1.7.0"
espresso = "3.7.0"
exifinterface = "1.4.1"
mlkit-text-recognition = "16.0.1"
# Stage-3 端侧稠密腿运行时（LiteRT）。钉 2.1.6：本模块 minSdk=23，而 2.2.0 的
# `uses-sdk minSdkVersion=24` 会被 manifest 合并直接拒绝（本轮实测 AAR 字节）。
litert = "2.1.6"
# `litert-api:2.1.6` 的 POM 传递依赖。litert-api 与 litert 共用同一个 namespace
# `com.google.ai.edge.litert`，AGP 9 的 app manifest 合并判其为错误（库 namespace 必须唯一），
# 所以 core:data 把 litert-api 从 Android 依赖图里摘出来、改走构建期派生的本地 AAR
# （只改清单 namespace，其余逐字节保留）。摘出来之后这四条传递依赖要显式补回，
# classpath 才与上游 POM 等价——版本号与 POM 一字不差。
litert-api-lifecycle-runtime = "2.10.0"
litert-api-guava = "33.5.0-android"
litert-api-coroutines-guava = "1.8.0"
litert-api-play-delivery = "0.1.1-alpha01"
# 4E JS 视觉引擎（批次 21，主会话裁定 2）：消费发布 AAR，钉版**不动态追新**；自建 AAR 仅作
# 运行时实测失败回退（判据：任一仪器化门红且归因 AAR 构件）。供应链台账（2026-10-26 本线
# 独立下载复算，与 docs/research/2026-10-25-quickjs-aar-consumption.md §3.1 双源一致）：
#   aar  1,828,904 B  sha256=406c3efb80d5fa3495df4a7f2663be8cc30c974fe5c2368effa929de77cf0ed8
#                     （官方 .sha1 500962b09bcfd732aa530b96afe749fba6617a14，与本地计算一致）
#   pom      2,540 B  sha256=cc3ef4b3e8674771ef29d059c28935dd009e6dac7fb90765e497bd8414fe2bbc
#                     （官方 .sha1 71a99dbd5bc50f77127a5671eb729048ec0ea9bf，与本地计算一致）
# 传递依赖（POM 实文）：kotlin-stdlib 2.4.10（compile）、kotlinx-coroutines-core-jvm 1.11.0
# （runtime，与项目同版）。绑定层 Apache-2.0；内嵌引擎 bellard/quickjs 为 MIT。
quickjs-kt-android = "1.0.15"
# quickjs-kt-android 1.0.15 的 POM 传递要求 kotlin-stdlib **2.4.10**（compile scope）。
# 这是**上游事实**，不是本项目选择：批次 22 T3 按 R2 路径 A 在根 build.gradle.kts 把运行时
# 解析约束回 `kotlin = 2.3.21`（编译/运行同版；依据是 R2 §3.1 字节码扫描：AAR 的 88 条
# stdlib 成员引用在 2.3.21/2.4.10 两个 jar 中全部可解析，2.3.21 编译器直接编译 AAR 探针
# exit 0）。本条目只用于记录上游声明；`tools/ci/check_dependency_pins.py` 分别断言
# "POM 声明 == 本条目" 与 "解析出的 kotlin-stdlib == kotlin"。回退判据：若 AAR 升级后
# 字节码扫描 unresolved > 0，或设备轨 NoSuchMethodError/NoClassDefFoundError 归因 AAR，
# 则按 R2 路径 B 评估升级（当前被 KSP 无 2.4 版本阻断）。2026-10-26 复核：该降级对
# **完整解析图**的 API 兼容仍无证明（88 条扫描只覆盖 AAR），风险与关闭判据见 KD-73。
quickjs-kotlin-stdlib = "2.4.10"
desugar-jdk-libs = "2.0.3"
okhttp = "5.4.0"
work = "2.10.5"
richtext = "0.17.0"

